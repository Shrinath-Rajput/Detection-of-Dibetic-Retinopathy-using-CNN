{% extends "base.html" %}

{% block content %}

<style>
.container {
    max-width:600px;
    background:white;
    margin:40px auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.1);
}

h2 {
    color:#0d6efd;
    text-align:center;
}

.risk {
    font-size:18px;
    font-weight:bold;
    margin:15px 0;
    text-align:center;
}

ul {
    margin-top:10px;
    padding-left:20px;
}

.back {
    margin-top:20px;
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    background:#0d6efd;
    padding:12px;
    border-radius:6px;
}

.back:hover {
    background:#0b5ed7;
}

/* 🔥 MOBILE FIX */
@media (max-width:768px){
    .container{
        margin:20px;
        padding:20px;
    }
}
</style>

<div class="container">

    <h2>🧠 Migraine Risk Result</h2>

    <div class="risk">
        Risk Level: {{ risk }}
    </div>

    <h4>Possible Triggers / Symptoms:</h4>
    <ul>
        {% for r in risks %}
            <li>{{ r }}</li>
        {% endfor %}
    </ul>

    <h4>Preventive Advice:</h4>
    <ul>
        {% for a in advice %}
            <li>{{ a }}</li>
        {% endfor %}
    </ul>

    <a class="back" href="/migraine">⬅ Back to Migraine Check</a>

</div>

{% endblock %}
