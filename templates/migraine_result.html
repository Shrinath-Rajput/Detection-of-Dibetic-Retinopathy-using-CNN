{% extends "base.html" %}
{% block content %}

<style>
.container {
    max-width:600px;
    background:white;
    margin:40px auto;
    padding:25px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.1);
    transition:0.3s;
}

/* hover */
.container:hover{
    transform:translateY(-5px);
}

h2 {
    color:#0d6efd;
    text-align:center;
}

/* 🔥 risk animation */
.risk {
    font-size:20px;
    font-weight:bold;
    margin:15px 0;
    text-align:center;
    animation:pulse 1.2s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.05);}
}

ul {
    margin-top:10px;
    padding-left:20px;
}

li{
    margin:6px 0;
    animation:fadeItem 0.5s ease;
}

@keyframes fadeItem{
    from{
        opacity:0;
        transform:translateX(-10px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.back {
    margin-top:20px;
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    background:#0d6efd;
    padding:12px;
    border-radius:6px;
    transition:0.3s;
}

.back:hover {
    transform:scale(1.05);
}

/* mobile */
@media (max-width:768px){
    .container{
        margin:20px;
        padding:20px;
    }
}
</style>

<div class="container animate">

    <h2 class="animate">🧠 Migraine Risk Result</h2>

    <div class="risk animate">
        Risk Level: {{ risk }}
    </div>

    <h4 class="animate">Possible Triggers / Symptoms:</h4>
    <ul>
        {% for r in risks %}
            <li class="animate">{{ r }}</li>
        {% endfor %}
    </ul>

    <h4 class="animate">Preventive Advice:</h4>
    <ul>
        {% for a in advice %}
            <li class="animate">{{ a }}</li>
        {% endfor %}
    </ul>

    <a class="back animate" href="/migraine">
        ⬅ Back to Migraine Check
    </a>

</div>

{% endblock %}
