{% extends "base.html" %}

{% block content %}

<div class="chat-container animate">
    <h2 class="animate">{{ t('chat.title') }}</h2>

    <div id="chat-box" class="chat-box"></div>

    <div class="input-area animate">
        <input type="text" id="user-input" placeholder="{{ t('chat.placeholder') }}" />
        <button onclick="sendMessage()">{{ t('chat.send') }}</button>
    </div>
</div>

<style>
.chat-container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    transition:0.3s;
}

/* hover */
.chat-container:hover{
    transform:translateY(-5px);
}

.chat-box{
    height:350px;
    overflow-y:auto;
    border:1px solid #ddd;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    background:#f9f9f9;
}

/* message animation */
.message{
    margin:10px 0;
    padding:10px 14px;
    border-radius:8px;
    max-width:75%;
    animation:fadeMsg 0.4s ease;
}

@keyframes fadeMsg{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

.user{
    background:#0d6efd;
    color:white;
    margin-left:auto;
    text-align:right;
}

.bot{
    background:#e9ecef;
}

/* input */
.input-area{
    display:flex;
    gap:10px;
}

.input-area input{
    flex:1;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

.input-area input:focus{
    outline:none;
    border-color:#0d6efd;
    box-shadow:0 0 5px rgba(13,110,253,0.5);
}

.input-area button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    transition:0.3s;
}

.input-area button:hover{
    transform:scale(1.05);
}

/* mobile */
@media (max-width:768px){
    .chat-box{height:300px;}
    .chat-container{padding:15px;}
}
</style>

<script>
function sendMessage(){
    let input = document.getElementById("user-input");
    let message = input.value.trim();
    if(message === "") return;

    appendMessage(message, "user");

    fetch("/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({message: message})
    })
    .then(res => res.json())
    .then(data => {
        appendMessage(data.reply, "bot");
    });

    input.value = "";
}

function appendMessage(text, type){
    let box = document.getElementById("chat-box");
    let div = document.createElement("div");

    div.className = "message " + type;
    div.innerText = text;

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>

{% endblock %}
