{% extends "base.html" %}
{% block content %}

<h3 style="text-align:center;">🤖 AI Healthcare Chatbot</h3>

<div id="chat-box" class="chat-box">
    <p class="bot-msg"><strong>Bot:</strong> Hello! Ask me anything.</p>
</div>

<br>

<div class="input-group chat-input">
    <input type="text" id="userInput" class="form-control" placeholder="Ask a question...">
    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
</div>

<style>
.chat-box{
    border:1px solid #ccc;
    padding:10px;
    height:320px;
    overflow-y:auto;
    background:#f9f9f9;
    border-radius:8px;
}

.bot-msg{
    background:#e9ecef;
    padding:8px;
    border-radius:6px;
    margin:5px 0;
}

.user-msg{
    background:#0d6efd;
    color:white;
    padding:8px;
    border-radius:6px;
    margin:5px 0;
    text-align:right;
}

/* mobile fix */
.chat-input{
    display:flex;
    gap:10px;
}

@media (max-width:768px){
    .chat-box{
        height:260px;
    }

    .chat-input{
        flex-direction:column;
    }

    .chat-input button{
        width:100%;
    }
}
</style>

<script>
function sendMessage() {
    let input = document.getElementById("userInput");
    let msg = input.value.trim();
    if (msg === "") return;

    let chatBox = document.getElementById("chat-box");

    // user message
    chatBox.innerHTML += `<div class="user-msg"><strong>You:</strong> ${msg}</div>`;

    fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: msg })
    })
    .then(res => res.json())
    .then(data => {
        chatBox.innerHTML += `<div class="bot-msg"><strong>Bot:</strong> ${data.reply}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    input.value = "";
}
</script>

{% endblock %}
