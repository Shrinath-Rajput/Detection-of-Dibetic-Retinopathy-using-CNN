<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction Result</title>

    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8f2ff 50%, #f0f8ff 100%);
            color: #1a1f3a;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 51, 102, 0.15);
            transition: all 0.4s ease;
        }

        .container:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 60px rgba(0, 51, 102, 0.2);
        }

        h2 {
            text-align: center;
            color: #003366;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        h4 {
            color: #003366;
            font-size: 18px;
            font-weight: 600;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .risk {
            color: #dc2626;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            animation: pulse 1.2s infinite alternate;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.08), rgba(248, 113, 113, 0.08));
            border-radius: 12px;
            border-left: 4px solid #dc2626;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 12px 0 12px 30px;
            position: relative;
            animation: fadeItem 0.5s ease;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 51, 102, 0.08);
        }

        li:last-child {
            border-bottom: none;
        }

        li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #16a34a;
            font-weight: 800;
            font-size: 16px;
        }

        @keyframes fadeItem {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #003366 0%, #0052a3 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 51, 102, 0.2);
            width: 100%;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 51, 102, 0.3);
        }

        .animate {
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 25px;
            }

            h2 {
                font-size: 24px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

{% include "_navbar.html" %}

<div class="container animate">

    <h2 class="animate">🧪 Diabetes Risk Assessment</h2>

    <div class="risk animate">{{ risk }}</div>

    <h4 class="animate">🎯 Preventive Recommendations</h4>
    <ul>
        {% for a in advice %}
            <li class="animate">{{ a }}</li>
        {% endfor %}
    </ul>

    <a href="/diabetes" class="btn animate">
        🔁 Perform Another Assessment
    </a>

</div>

</body>
</html>
