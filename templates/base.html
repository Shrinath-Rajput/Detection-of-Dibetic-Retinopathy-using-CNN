<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareSense Assistant</title>

    <style>
        body {
            margin:0;
            font-family: Arial, sans-serif;
            background:#f4f6f8;
        }

        /* NAVBAR */
        .navbar {
            background:#0d6efd;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
        }

        .logo {
            color:white;
            font-size:22px;
            font-weight:bold;
        }

        .menu {
            list-style:none;
            display:flex;
            margin:0;
            padding:0;
        }

        .menu a {
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-weight:bold;
        }

        .menu a:hover {
            color:#ffd43b;
        }

        /* MOBILE */
        .menu-toggle {
            display:none;
            font-size:26px;
            color:white;
            cursor:pointer;
        }

        @media(max-width:768px){
            .menu-toggle{display:block}
            .menu{
                display:none;
                flex-direction:column;
                width:100%;
            }
            .menu.active{display:flex}
        }

        /* CONTENT */
        .content{
            padding:40px;
        }

        /* 🔥 ANIMATION */
        .animate{
            opacity:0;
            transform:translateY(40px);
            transition:all 0.8s ease;
        }

        .animate.show{
            opacity:1;
            transform:translateY(0);
        }

        /* CARD */
        .card{
            transition:0.3s;
        }
        .card:hover{
            transform:translateY(-10px) scale(1.03);
            box-shadow:0 20px 40px rgba(0,0,0,0.2);
        }

        /* BUTTON */
        button{
            transition:0.3s;
        }
        button:hover{
            transform:scale(1.05);
        }

    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">🧠 CareSense</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <ul class="menu" id="menu">
        <li><a href="/">Home</a></li>
        <li><a href="/dr">DR</a></li>
        <li><a href="/pcod">PCOD</a></li>
        <li><a href="/diabetes">Diabetes</a></li>
        <li><a href="/migraine">Migraine</a></li>
        <li><a href="/live_health">Sensor</a></li>
        <li><a href="/chatbot">AI</a></li>
    </ul>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

<script>
function toggleMenu(){
    document.getElementById("menu").classList.toggle("active");
}

/* 🔥 ANIMATION ENGINE */
const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

window.onload = () => {
    document.querySelectorAll(".animate").forEach(el=>{
        observer.observe(el);
    });
};
</script>

</body>
</html>
