<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareSense Assistant</title>

    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- STYLES -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* Global Premium Design */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8f2ff 50%, #f0f8ff 100%);
            color: #1a1f3a;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* NAVBAR PREMIUM */
        .navbar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 8px 32px rgba(0, 51, 102, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .navbar:hover {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 12px 40px rgba(0, 51, 102, 0.12);
        }

        .navbar h2 {
            color: #003366;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #003366 0%, #0052a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a {
            color: #1a1f3a;
            text-decoration: none;
            margin: 0 12px;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            background: rgba(0, 51, 102, 0.08);
            color: #0052a3;
            transform: translateY(-2px);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #0052a3, #0099ff);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Dropdown */
        .dropdown-wrapper {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            min-width: 200px;
            right: 0;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0, 51, 102, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 1001;
            padding: 8px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-menu a {
            color: #1a1f3a;
            display: block;
            padding: 12px 16px;
            margin: 4px 0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .dropdown-menu a:hover {
            background: linear-gradient(135deg, rgba(0, 51, 102, 0.1), rgba(0, 153, 255, 0.1));
            color: #0052a3;
        }

        .dropdown-wrapper:hover .dropdown-menu {
            display: block;
        }

        /* Menu Toggle Mobile */
        .menu-toggle {
            display: none;
            font-size: 26px;
            color: #003366;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            transform: scale(1.2);
        }

        /* Content */
        .content {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* FOOTER */
        footer {
            background: rgba(0, 51, 102, 0.05);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            text-align: center;
            color: #4a5568;
            font-size: 14px;
            margin-top: 80px;
        }

        footer p {
            margin: 8px 0;
        }

        /* ANIMATIONS */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .animate {
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .animate:nth-child(1) { animation-delay: 0.1s; }
        .animate:nth-child(2) { animation-delay: 0.2s; }
        .animate:nth-child(3) { animation-delay: 0.3s; }
        .animate:nth-child(4) { animation-delay: 0.4s; }
        .animate:nth-child(5) { animation-delay: 0.5s; }
        .animate:nth-child(6) { animation-delay: 0.6s; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .navbar {
                padding: 14px 20px;
            }

            .navbar h2 {
                font-size: 20px;
            }

            .menu-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                margin-top: 15px;
                gap: 0;
            }

            .nav-links a {
                margin: 8px 0;
                padding: 12px;
                width: 100%;
                text-align: center;
            }

            .nav-links.active {
                display: flex;
            }

            .dropdown-menu {
                position: static;
                box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            .content {
                padding: 20px;
            }

            footer {
                padding: 30px 20px;
            }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>
    {% include "_navbar.html" %}

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>🏥 CareSense Assistant - AI-Powered Healthcare Platform</p>
        <p>© 2024 Advanced Health Monitoring | Medical Disclaimer: For awareness only</p>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById("navLinks").classList.toggle("active");
        }

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>

</html>
