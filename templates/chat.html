{% extends "base.html" %}

{% block content %}

<div class="chat-container">
    <h2>🤖 AI Health Assistant</h2>

    <div id="chat-box" class="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask something..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<style>
.chat-container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.chat-box{
    height:350px;
    overflow-y:auto;
    border:1px solid #ddd;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    background:#f9f9f9;
}

.message{
    margin:10px 0;
    padding:8px 12px;
    border-radius:6px;
    max-width:75%;
}

.user{
    background:#0d6efd;
    color:white;
    margin-left:auto;
    text-align:right;
}

.bot{
    background:#e9ecef;
    color:black;
}

.input-area{
    display:flex;
    gap:10px;
}

.input-area input{
    flex:1;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

.input-area button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
}

.input-area button:hover{
    background:#0b5ed7;
}

/* 🔥 Mobile responsive */
@media (max-width:768px){
    .chat-container{
        padding:15px;
    }

    .chat-box{
        height:300px;
    }
}
</style>

<script>
function sendMessage(){
    let input = document.getElementById("user-input");
    let message = input.value.trim();
    if(message === "") return;

    appendMessage(message, "user");

    fetch("/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({message: message})
    })
    .then(res => res.json())
    .then(data => {
        appendMessage(data.reply, "bot");
    });

    input.value = "";
}

function appendMessage(text, type){
    let box = document.getElementById("chat-box");
    let div = document.createElement("div");
    div.classList.add("message", type);
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>

{% endblock %}
